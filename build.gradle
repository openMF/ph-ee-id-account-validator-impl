plugins {
	id 'java'
	id 'org.springframework.boot' version '3.4.4'
	id 'io.spring.dependency-management' version '1.1.6'
	id 'eclipse'
	id 'maven-publish'
}
// The com.jfrog.artifactory plugin was removed: deploy strategy is being
// reworked ecosystem-wide; maven-publish stays for local publishing.

group = 'org.mifos'
version = '2.0.0.mifos-SNAPSHOT'
sourceCompatibility = JavaVersion.VERSION_21
targetCompatibility = JavaVersion.VERSION_21
def artifactId = 'account-conncetor-validation-impl'
def versionNumber = version

repositories {
    mavenCentral()
    // mavenLocal()
    maven {
        url = uri('https://repo.maven.apache.org/maven2/')
    }
    maven {
        url = uri('https://mifos.jfrog.io/artifactory/phee-gradle-local')
    }    
    maven {
        url = uri('https://mifos.jfrog.io/artifactory/mifosx-gradle-local')
    }

    // Mifos Platform BOM + ph-ee-connector-common 2.0.0-SNAPSHOT are consumed
    // from the local JFrog Artifactory sandbox (Docker Compose in
    // proposal/local-jfrog/). Swap this host for the production Mifos JFrog
    // when the official BOM is ready.
    maven {
        name = 'LocalJFrog'
        url = uri('http://localhost:8081/artifactory/mifos-platform-snapshot')
        allowInsecureProtocol = true
        credentials {
            username = findProperty('localJfrog.user') ?: System.getenv('LOCAL_JFROG_USER')
            password = findProperty('localJfrog.key') ?: System.getenv('LOCAL_JFROG_KEY')
        }
    }
}

dependencies {
	// Mifos Platform BOM pins Spring Boot 3.4, Zeebe 8, Jakarta EE 10 and every
	// other shared library version. Use platform() (not enforcedPlatform):
	// this is a published library, and enforced platforms leak forced versions
	// into the publication metadata of downstream consumers.
	implementation platform('org.mifos.platform:mifos-platform-bom:1.0.0-SNAPSHOT')

	implementation 'org.springframework.boot:spring-boot-starter'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	implementation 'io.rest-assured:rest-assured'
	implementation 'com.fasterxml.jackson.core:jackson-databind'
	implementation 'io.camunda:zeebe-client-java'
	implementation 'org.mifos:ph-ee-connector-common:2.0.0-SNAPSHOT'
	implementation 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
}

// This is a library, not an executable Spring Boot app: the plain jar is what
// downstream components (e.g. ph-ee-identity-account-mapper) consume.
tasks.named('bootJar') { enabled = false }
tasks.named('jar') { enabled = true; archiveClassifier = '' }

tasks.named('test') {
	useJUnitPlatform()
}

sourceSets {
	main {
		java {
			// Include all source files by default
			srcDirs = ['src/main/java']

			// Exclude the package if a system property is set
			if (System.getProperty('gsma')) {
				exclude 'org/mifos/pheeidmaapperaccountvalidatorimp/mojaloopconnector/**'
			}
			else if(System.getProperty('mojaloop')){
				exclude 'org/mifos/accountvalidatorconnector/gsmaconnector/**'

			}
		}
	}
}

jar {
	// Set the archive name based on the condition
	if (System.getProperty('gsma')) {
		archiveFileName = "account-validator-connector-gsma-${project.version}.jar"
	}
	else if (System.getProperty('mojaloop')) {
		archiveFileName = "account-validator-connector-mojaloop-${project.version}.jar"
	}
}
publishing {
	publications {
		mavenJava(MavenPublication) {
			from(components.java)
		}
	}
}
tasks.withType(JavaCompile) {
	options.encoding = 'UTF-8'
}


